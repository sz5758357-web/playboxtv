<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>PlayBoxTV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0A0A1A; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 12px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #1A1A3E, #2A1A4E);
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            border: 1px solid #E9456033;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon { font-size: 28px; }
        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #E94560, #FF6B81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #E9456044;
            background: #0A0A2E;
            color: #fff;
            font-size: 14px;
            min-width: 150px;
        }
        .header input:focus {
            outline: none;
            border-color: #E94560;
        }
        .header button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #E94560;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .header button:hover { background: #FF6B81; transform: scale(1.02); }
        .header .secondary-btn {
            background: #2A1A4E;
        }
        .header .secondary-btn:hover { background: #3A2A5E; }

        .status {
            padding: 10px 16px;
            background: #1A1A3E;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            border-left: 3px solid #E94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        .status .live {
            color: #FF4444;
            font-weight: bold;
            font-size: 12px;
            background: #FF444422;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .status .live.off {
            color: #666;
            background: #333;
        }

        .main {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .channels {
            flex: 1;
            min-width: 280px;
            max-height: 500px;
            overflow-y: auto;
            background: #1A1A3E;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #E9456033;
        }
        .channels::-webkit-scrollbar { width: 6px; }
        .channels::-webkit-scrollbar-track { background: #1A1A3E; }
        .channels::-webkit-scrollbar-thumb { background: #E94560; border-radius: 3px; }
        
        .channels .search {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #E9456044;
            background: #0A0A2E;
            color: #fff;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .channels .search:focus {
            outline: none;
            border-color: #E94560;
        }
        .channel-item {
            padding: 10px 14px;
            margin: 3px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .channel-item:hover {
            background: #2A2A5E;
        }
        .channel-item.active {
            background: #E9456022;
            border-left: 3px solid #E94560;
            color: #E94560;
            font-weight: 600;
        }
        .channel-item .num {
            color: #666;
            font-size: 11px;
            min-width: 30px;
        }

        .player {
            flex: 2;
            min-width: 320px;
            background: #1A1A3E;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #E9456033;
        }
        .player video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            max-height: 400px;
        }
        .player-controls {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .player-controls button {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: #E94560;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .player-controls button:hover { transform: scale(1.05); }
        .player-controls .secondary {
            background: #2A1A4E;
        }
        .player-controls .secondary:hover { background: #3A2A5E; }
        .player-controls .current-channel {
            color: #E94560;
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            text-align: center;
        }

        .footer {
            margin-top: 16px;
            padding: 12px;
            text-align: center;
            color: #444;
            font-size: 12px;
            border-top: 1px solid #1A1A3E;
        }
        .footer span {
            color: #E94560;
            font-weight: 600;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1A1A3E;
            border-top: 3px solid #E94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 700px) {
            .header { flex-direction: column; align-items: stretch; }
            .header input { min-width: auto; }
            .main { flex-direction: column; }
            .channels { max-height: 300px; }
            .player { min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="logo-icon">📺</span>
                <span class="logo-text">PlayBoxTV</span>
            </div>
            <input type="text" id="m3uUrl" placeholder="Wklej link do listy M3U..." 
                   value="https://raw.githubusercontent.com/iptv-org/iptv/master/streams/pl.m3u">
            <button onclick="pobierzListe()">📡 Pobierz</button>
            <button class="secondary-btn" onclick="pobierzZPliku()">📂 Plik</button>
        </div>

        <div class="status" id="status">
            <span>✅ PlayBoxTV - Gotowy</span>
            <span class="live off" id="liveStatus">⏹ ZATRZYMANY</span>
        </div>

        <div class="main">
            <div class="channels" id="channelsList">
                <input class="search" type="text" id="searchInput" placeholder="🔍 Szukaj kanału..." onkeyup="filtrujKanaly()">
                <div id="channelList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <div class="player">
                <video id="videoPlayer" controls autoplay playsinline></video>
                <div class="player-controls">
                    <button onclick="zatrzymaj()">⏹ Zatrzymaj</button>
                    <button class="secondary" onclick="otworzZewnetrzny()">🔗 Zewnętrzny</button>
                    <span class="current-channel" id="currentChannel">📺 Wybierz kanał</span>
                </div>
                <div style="text-align:center;margin-top:8px;font-size:11px;color:#444;">
                    PlayBoxTV v1.0
                </div>
            </div>
        </div>

        <div class="footer">
            <span>PlayBoxTV</span> · Dekoder IPTV · <span id="channelCount">0</span> kanałów
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        let kanaly = [];
        let aktualnyKanal = null;
        let hls = null;
        let isPlaying = false;
        const video = document.getElementById('videoPlayer');

        function status(tekst, live = false) {
            const el = document.getElementById('status');
            const liveEl = document.getElementById('liveStatus');
            el.innerHTML = `<span>${tekst}</span>`;
            if (live) {
                liveEl.textContent = '🔴 NA ŻYWO';
                liveEl.className = 'live';
            } else {
                liveEl.textContent = '⏹ ZATRZYMANY';
                liveEl.className = 'live off';
            }
        }

        function pobierzListe() {
            const url = document.getElementById('m3uUrl').value.trim();
            if (!url) { status('❌ Wprowadź adres listy M3U!'); return; }
            status('⏳ Pobieranie listy...');
            document.getElementById('channelList').innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            fetch(url, {
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
            })
            .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
            .then(text => {
                parsujM3U(text);
                status(`✅ PlayBoxTV - ${kanaly.length} kanałów`);
                document.getElementById('channelCount').textContent = kanaly.length;
            })
            .catch(err => status(`❌ Błąd: ${err.message}`));
        }

        function pobierzZPliku() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.m3u,.m3u8';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    parsujM3U(ev.target.result);
                    status(`✅ PlayBoxTV - ${kanaly.length} kanałów z pliku`);
                    document.getElementById('channelCount').textContent = kanaly.length;
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function parsujM3U(zawartosc) {
            kanaly = [];
            const linie = zawartosc.split('\n');
            let nazwa = '', link = '';
            for (let line of linie) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const czesci = line.split(',');
                    nazwa = czesci.length > 1 ? czesci.slice(1).join(',').trim() : 'Nieznany';
                    nazwa = nazwa.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').trim();
                } else if (line && !line.startsWith('#') && (line.startsWith('http://') || line.startsWith('https://'))) {
                    link = line;
                    if (nazwa && link) { kanaly.push({ nazwa, link }); nazwa = ''; link = ''; }
                }
            }
            if (nazwa && link) kanaly.push({ nazwa, link });
            wyswietlKanaly();
        }

        function wyswietlKanaly() {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            kanaly.forEach((kanal, index) => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `<span class="num">${index+1}</span><span>${kanal.nazwa}</span>`;
                div.onclick = () => odtworzKanal(index);
                container.appendChild(div);
            });
        }

        function filtrujKanaly() {
            const szukaj = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.channel-item');
            items.forEach((item, index) => {
                const nazwa = kanaly[index]?.nazwa.toLowerCase() || '';
                item.style.display = (!szukaj || nazwa.includes(szukaj)) ? 'flex' : 'none';
            });
        }

        function odtworzKanal(index) {
            const kanal = kanaly[index];
            if (!kanal) return;
            aktualnyKanal = kanal;
            document.getElementById('currentChannel').textContent = `🎬 ${kanal.nazwa}`;
            status(`🎬 PlayBoxTV - ${kanal.nazwa}`, true);
            isPlaying = true;

            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.channel-item');
            if (items[index]) items[index].classList.add('active');

            zatrzymaj();

            if (kanal.link.includes('.m3u8') || kanal.link.includes('hls')) {
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(kanal.link);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = kanal.link;
                    video.play();
                } else {
                    status('⚠️ PlayBoxTV - HLS nie obsługiwany');
                }
            } else {
                video.src = kanal.link;
                video.play().catch(() => status('⚠️ PlayBoxTV - Błąd odtwarzania'));
            }
        }

        function zatrzymaj() {
            if (hls) { hls.destroy(); hls = null; }
            video.pause();
            video.src = '';
            video.load();
            isPlaying = false;
            document.getElementById('currentChannel').textContent = '⏹ Zatrzymano';
            status('⏹ PlayBoxTV - Zatrzymano');
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        }

        function otworzZewnetrzny() {
            if (!aktualnyKanal) { status('⚠️ Najpierw wybierz kanał!'); return; }
            window.open(aktualnyKanal.link, '_blank');
            status(`🔗 Otworzono: ${aktualnyKanal.nazwa}`);
        }

        window.onload = function() {
            setTimeout(pobierzListe, 500);
        };
    </script>
</body>
</html>
